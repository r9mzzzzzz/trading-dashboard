<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark"><meta name="theme-color" content="#0a0a0c">
<title>Quant Lab · NQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<!--
  Mise en page du dashboard. dashboard.py remplace le marqueur DATA (const D=…) par les données JSON et écrit dashboard.html.
  Tout est dans ce fichier : styles, graphiques SVG, verre liquide (fin de page). Aucune image, aucune dépendance.
-->
<style>
:root{
  color-scheme:dark;
  --bg:#0a0a0c;--card:#141417;--card2:#1c1c20;--card3:#26262b;
  --line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
  --text:#f5f5f7;--text2:#c7c7cc;--muted:#8e8e93;--faint:#5a5a60;
  --green:#30d158;--red:#ff453a;--orange:#ff9f0a;
  /* séries des graphiques (palette validée sur fond sombre) */
  --s1:#2a9cca;--s2:#d07a00;--s3:#b360ea;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r:18px;--side:248px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--red)}.mut{color:var(--muted)}

/* ---------- Structure ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:22px;background:linear-gradient(180deg,#0e0e11,#0a0a0c)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(145deg,#2c2c31,#17171a);box-shadow:inset 0 0 0 1px var(--line2)}
.logo svg{width:16px;height:16px}
.brand b{font:600 15px/1.1 var(--font-d);white-space:nowrap;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;letter-spacing:0}
.sec-t{font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;padding:0 10px;margin-bottom:6px}
.strat{display:flex;gap:11px;width:100%;text-align:left;background:none;border:0;padding:10px;border-radius:12px;
  cursor:pointer;transition:background .15s}
.strat:hover{background:rgba(255,255,255,.04)}
.strat.on{background:var(--card2);box-shadow:inset 0 0 0 1px var(--line)}
.strat .dot{flex:none;margin-top:6px}
.strat span.t{display:block;font-weight:550;letter-spacing:-.01em}
.strat small{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.live{background:var(--green);box-shadow:0 0 0 3px rgba(48,209,88,.16)}
.side-foot{margin-top:auto;padding:0 10px;color:var(--faint);font-size:11.5px;line-height:1.5}

main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;
  margin:10px 14px 0;padding:10px 12px 10px 18px;border-radius:16px;
  background:rgba(22,22,26,.72);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
  box-shadow:inset 0 0 0 1px var(--line),0 8px 30px rgba(0,0,0,.35)}
.topbar.verre-liquide{background:rgba(22,22,26,.5)}
.topbar .cur{font:600 14px var(--font-d);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .gen{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
.tabs{display:none}
.wrap{max-width:1180px;margin:0 auto;padding:26px 28px 48px;display:flex;flex-direction:column;gap:18px}

/* ---------- En-tête de stratégie ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end;padding:18px 4px 6px}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:550;padding:5px 11px 5px 9px;border-radius:999px;
  background:var(--card2);box-shadow:inset 0 0 0 1px var(--line);color:var(--text2)}
.pill.live{color:#7ee59a;background:rgba(48,209,88,.1);box-shadow:inset 0 0 0 1px rgba(48,209,88,.22)}
.hero h1{margin:14px 0 6px;font:700 clamp(30px,4.4vw,46px)/1.02 var(--font-d);letter-spacing:-.035em}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.big{text-align:right}
.big b{display:block;font:700 clamp(30px,4vw,44px)/1 var(--font-d);letter-spacing:-.03em}
.big span{color:var(--muted);font-size:12.5px}

/* ---------- Cartes ---------- */
.card{background:var(--card);border-radius:var(--r);padding:20px 22px;box-shadow:inset 0 0 0 1px var(--line)}
.card-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-h h2{margin:0;font:600 17px/1.2 var(--font-d);letter-spacing:-.02em}
.card-h .sp{flex:1}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px}

.rules{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.rules li{display:flex;gap:12px;background:var(--card2);border-radius:12px;padding:12px 14px;color:var(--text2);font-size:13.5px;line-height:1.45}
.rules li i{font-style:normal;flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;
  background:var(--card3);color:var(--muted);font-size:11.5px;font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:inset 0 0 0 1px var(--line)}
.card .kpi{background:var(--card2);box-shadow:none}
.kpi>span{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.kpi b{display:block;font:650 24px/1.1 var(--font-d);letter-spacing:-.025em}
.kpi small{display:block;color:var(--faint);font-size:11.5px;margin-top:4px}

.seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px;gap:2px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{background:none;border:0;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:550;transition:.15s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--card3);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.4)}

/* ---------- Calendrier ---------- */
.cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.cal-nav b{font:600 15px var(--font-d);letter-spacing:-.01em;text-transform:capitalize;min-width:130px;text-align:center}
.nav{width:30px;height:30px;border-radius:9px;border:0;background:var(--card2);cursor:pointer;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1px var(--line);font-size:16px;line-height:1}
.nav:disabled{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,.9fr);gap:6px}
.cal .hd{color:var(--faint);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;text-align:center;padding-bottom:2px}
.cal .c{background:var(--card2);border-radius:10px;min-height:70px;padding:7px 9px;position:relative}
.cal .c .n{color:var(--muted);font-size:11.5px}
.cal .c .v{position:absolute;right:9px;bottom:7px;font:600 14.5px var(--font-d);letter-spacing:-.01em}
.cal .c.empty{background:transparent}
.cal .c.wk{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.cal .c.wk .v{font-size:13.5px}
.month-tot{font:600 14px var(--font-d)}

/* ---------- Graphiques ---------- */
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.chart text{fill:var(--faint);font:11px var(--font)}
.tip{position:absolute;pointer-events:none;background:rgba(38,38,43,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.4;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.45),inset 0 0 0 1px var(--line2);
  opacity:0;transition:opacity .12s;transform:translate(-50%,calc(-100% - 12px))}
.tip b{font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend i.area{height:10px;border-radius:3px}
.divider{height:1px;background:var(--line);margin:20px 0}

/* ---------- Tableau ---------- */
.table-wrap{overflow-x:auto;margin:0 -6px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;text-align:right;white-space:nowrap}
th{color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid rgba(255,255,255,.04);color:var(--text2)}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(255,255,255,.025)}
td:first-child,th:first-child{text-align:left}
.side{display:inline-block;font-size:11px;font-weight:650;letter-spacing:.04em;padding:2px 8px;border-radius:6px}
.side.b{color:#7ee59a;background:rgba(48,209,88,.12)}.side.s{color:#ff8a82;background:rgba(255,69,58,.12)}
.r-chip{font-weight:600}

/* ---------- Lucid ---------- */
.bar{display:flex;gap:2px;height:30px;border-radius:9px;overflow:hidden;margin:10px 0 2px}
.bar div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:650;color:#0a0a0c;min-width:0}
.note{color:var(--muted);font-size:12.5px;line-height:1.55;margin:12px 0 0}
.empty-state{color:var(--muted);font-size:13px;background:var(--card2);border-radius:12px;padding:14px 16px}
code{font-family:var(--mono);font-size:12px;background:var(--card3);padding:1px 6px;border-radius:5px;color:var(--text2)}
footer{color:var(--faint);font-size:12px;text-align:center;padding:8px 0 0}

/* ---------- Téléphone ---------- */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  .topbar{flex-direction:column;align-items:stretch;gap:10px;margin:8px 10px 0;padding:12px}
  .topbar .row{display:flex;align-items:center;gap:10px}
  .topbar .cur{display:none}
  .topbar .gen{font-size:11px}
  .cal-nav b{min-width:0;flex:1}
  .cal-nav .lbl{display:none}
  .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;border:0;background:rgba(255,255,255,.06);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:550;
    color:var(--text2);display:flex;align-items:center;gap:7px;cursor:pointer}
  .tabs button.on{background:var(--text);color:#0a0a0c}
  .tabs button.on .dot:not(.live){background:#0a0a0c}
  .wrap{padding:16px 16px 40px;gap:14px}
  .hero{grid-template-columns:1fr;gap:14px;padding-top:10px}
  .big{text-align:left}
  .card{padding:16px}
  .grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cal{gap:4px}
  .cal .c{min-height:54px;padding:5px 6px;border-radius:8px}
  .cal .c .v{font-size:11.5px;right:5px;bottom:5px}
  .cal .hd{font-size:9.5px;letter-spacing:.02em}
}
@media (min-width:901px){.topbar .row{display:contents}.topbar .brand{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script type="module">

const NS = 'http://www.w3.org/2000/svg';

  bezel: 0.6, // curved rim width as a fraction of the lens half-size (min side); 1 = full dome
  curvature: 4, // rim profile exponent: 2 = circular, 4 = squircle-like, higher = steeper rim
  ior: 1.5, // index of refraction; shapes how quickly the bend fades from the rim inward

  chroma: 0.12, // colour fringe; blue bends (1 + chroma)x as far as red. 0 skips the extra passes
  blur: 0, // frost, CSS px
  specular: 0.45, // rim highlight 0..1. 0 skips the pass

// attribute update on an existing filter.
const MAP_KEYS = ['width', 'height', 'radius', 'bezel', 'curvature', 'ior', 'invert', 'specular', 'specularWidth', 'lightAngle'];

/* Displacement map                                                                                   */
/* ------------------------------------------------------------------------------------------------ */

const profileCache = new Map();

// The glass surface height is h(s) = (1 - (1 - s)^k)^(1/k). A vertical ray hitting a surface tilted
// by theta refracts to asin(sin(theta) / ior); the lateral offset grows with tan(theta - refracted).
function profileTable(curvature, ior) {

    const slope = Math.pow(1 - s, curvature - 1) * Math.pow(Math.max(1 - a, 1e-9), 1 / curvature - 1);

        ny = 0;

  }

  add('feComposite', { in: lit, in2: 'lensShape', operator: 'in', result: 'lens' }, true);
  add('feComposite', { in: 'SourceGraphic', in2: 'lensShape', operator: 'out', result: 'outside' });
  add('feComposite', { in: 'lens', in2: 'outside', operator: 'over' });
  return { image, aspect, blur, displace, lensRect };
}

// With primitiveUnits="objectBoundingBox" (the only units WebKit renders — userSpaceOnUse turns the
// whole element blank), feDisplacementMap's `scale` is a fraction of the box, and each engine turns
// it into pixels differently (measured):
//   Blink:  x and y both use width
//   WebKit: x uses width, y uses height
//   Gecko:  x and y both use sqrt((w^2 + h^2) / 2)
// Returns the `scale` that bends `px` pixels on both axes, plus per-axis factors (<= 1) that squeeze
// the map's R/G channels where the engine would otherwise over-bend one axis.
function bendScale(px, w, h) {
  if (engine === 'webkit') {
    const m = Math.min(w, h);
    return { scale: (2 * px) / m, kx: m / w, ky: m / h };
  }
  if (engine === 'gecko') return { scale: (2 * px) / Math.sqrt((w * w + h * h) / 2), kx: 1, ky: 1 };
  return { scale: (2 * px) / w, kx: 1, ky: 1 };
}

function setRect(n, x, y, w, h) {
  n.setAttribute('x', x);
  n.setAttribute('y', y);
  n.setAttribute('width', w);
  n.setAttribute('height', h);
}

/* ------------------------------------------------------------------------------------------------ */
/* Controller                                                                                         */
/* ------------------------------------------------------------------------------------------------ */

let uid = 0;

/**
 * Put a glass lens on `target`.
 *
 * mode 'content' (default): bends target's own pixels. Works everywhere. Put the thing to refract
 *   INSIDE target (or a decorative copy of it — see references/patterns.md).
 * mode 'backdrop': bends what is behind target via `backdrop-filter: url()`. Chromium only; other
 *   engines get `fallback` (a plain CSS backdrop-filter) instead.
 *
 * Options: everything in DEFAULTS, plus
 *   fit: true       lens follows target's own size (x = y = 0, width/height = border box)
 *   clip: true      clip target to the lens shape (overlay-copy pattern)
 *   fallback: str   backdrop-filter used by mode 'backdrop' outside Chromium
 *   sync: true      apply updates immediately instead of on the next animation frame
 *   hidden: true    no lens at all (filter removed; with clip, the element is clipped away).
 *                   Toggle with update({ hidden }) — e.g. a magnifier when the pointer leaves
 *
 * Lens coordinates are CSS px relative to target's border box; they are converted to fractions of
 * that box internally, and the filter output is clipped to it.
 */
function createGlass(target, options = {}) {
  const base = `lg${++uid}`;
  const mode = options.mode ?? 'content';
  const fallback = options.fallback ?? 'blur(12px) saturate(1.6)';
  const p = { ...DEFAULTS, ...pick(options) };
  const flags = { fit: !!options.fit, clip: !!options.clip, sync: !!options.sync, hidden: !!options.hidden };
  const useBackdropURL = mode === 'backdrop' && engine === 'blink';
  const active = mode !== 'backdrop' || useBackdropURL;

  if (!active) {
    target.style.backdropFilter = fallback;
    target.style.webkitBackdropFilter = fallback;
  }

  const filter = node('filter', {
    filterUnits: 'objectBoundingBox',
    x: 0,
    y: 0,
    width: 1,
    height: 1,
    primitiveUnits: 'objectBoundingBox',
    // sRGB keeps 128 meaning "no bend"; the default linearRGB would shift every pixel.
    'color-interpolation-filters': 'sRGB',
  });
  if (active) defsNode().appendChild(filter);

  let graph = null;
  let structure = '';
  let wanted = ''; // key of the newest map requested
  let requested = 0; // request counter, so a slow decode never replaces a newer map
  let shown = { key: '', seq: -1 }; // map currently referenced by feImage
  let version = 0;
  let frame = 0;
  let settleTimers = [];
  let destroyed = false;
  let box = { width: target.offsetWidth, height: target.offsetHeight };

  // Filter coordinates are fractions of the element box, so every resize has to re-flush.
  const observer = active
    ? new ResizeObserver(() => {
        box = { width: target.offsetWidth, height: target.offsetHeight };
        schedule();
      })
    : null;
  observer?.observe(target);

  // Re-issue the filter id shortly after a map swap: WebKit loads its own copy of the data URL and
  // does not repaint the filter when that load lands.
  function settle() {
    settleTimers.forEach(clearTimeout);
    settleTimers = [60, 250].map((ms) => setTimeout(schedule, ms));
  }

  function show(entry, seq) {
    if (seq <= shown.seq || !graph) return false;
    graph.image.setAttribute('href', entry.url);
    graph.image.setAttributeNS(XLINK, 'xlink:href', entry.url);
    shown = { key: entry.key, seq };
    settle();
    return true;
  }

  function flush() {
    frame = 0;
    if (destroyed || !active) return;
    if (flags.hidden) {
      if (useBackdropURL) target.style.backdropFilter = '';
      else target.style.filter = '';
      if (flags.clip) target.style.clipPath = 'inset(50%)';
      return;
    }
    const W = box.width;
    const H = box.height;
    if (W < 1 || H < 1) return; // not laid out yet; the ResizeObserver will call back
    if (flags.fit) {
      p.x = 0;
      p.y = 0;
      p.width = W;
      p.height = H;
    }
    if (p.width < 1 || p.height < 1) return;

    const s = `${p.chroma > 0}|${p.blur > 0}|${p.specular > 0}`;
    if (s !== structure) {
      graph = buildGraph(filter, p);
      structure = s;
      shown = { key: '', seq: -1 };
      wanted = '';
    }

    const dpr = window.devicePixelRatio || 1;
    const scale = p.mapScale > 0 ? p.mapScale : Math.min(dpr, 2);
    // Snap the lens to device pixels: fractional sub-regions shimmer while the lens moves.
    const snap = (v) => Math.round(v * dpr) / dpr;
    const x = snap(p.x);
    const y = snap(p.y);
    const w = snap(p.width);
    const h = snap(p.height);

    const key = mapKeyOf(p, scale);
    if (wanted !== key) {
      wanted = key;
      const entry = lensMap(p, scale, key);
      const seq = ++requested;
      if (entry.decoded) show(entry, seq);
      // While a squish animation requests a new map every frame, show the newest map that has
      // finished decoding (stretched to the current rect) instead of waiting for the latest one.
      else entry.ready.then(() => !destroyed && show(entry, seq) && schedule());
    }
    if (flags.clip) {
      const r = Math.min(p.radius, w / 2, h / 2);
      target.style.clipPath = `inset(${y}px ${W - x - w}px ${H - y - h}px ${x}px round ${r}px)`;
    }
    if (!shown.key) return; // first map not ready yet: leave the element unfiltered

    for (const n of graph.lensRect) setRect(n, x / W, y / H, w / W, h / H);
    const { scale: k, kx, ky } = bendScale(p.refraction, W, H);
    const scales = graph.displace.length === 3 ? [k, k * (1 + p.chroma / 2), k * (1 + p.chroma)] : [k];
    graph.displace.forEach((n, i) => n.setAttribute('scale', scales[i]));
    if (graph.aspect) {
      graph.aspect.setAttribute('values', `${kx} 0 0 0 ${(1 - kx) / 2}  0 ${ky} 0 0 ${(1 - ky) / 2}  0 0 1 0 0  0 0 0 1 0`);
    }
    if (graph.blur) {
      graph.blur.setAttribute('stdDeviation', `${p.blur / W} ${p.blur / H}`);
      const pad = Math.ceil(p.refraction * (1 + p.chroma) + 3 * p.blur);
      setRect(graph.blur, (x - pad) / W, (y - pad) / H, (w + 2 * pad) / W, (h + 2 * pad) / H);
    }

    // WebKit caches filter output per filter id and keeps serving it after the graph changes;
    // a fresh id on every update forces it to re-read.
    filter.id = `${base}-v${++version}`;
    const ref = `url(#${filter.id})`;
    if (useBackdropURL) target.style.backdropFilter = ref;
    else target.style.filter = ref;
  }

  function schedule() {
    if (flags.sync) flush();
    else if (!frame) frame = requestAnimationFrame(flush);
  }

  schedule();

  return {
    /** Merge new lens geometry / optics. Moving the lens never regenerates the map. */
    update(next = {}) {
      const changes = pick(next);
      const hidden = next.hidden === undefined ? flags.hidden : !!next.hidden;
      // Skip no-op updates: every flush re-issues the filter id, which repaints the glass.
      if (hidden === flags.hidden && Object.keys(changes).every((k) => changes[k] === p[k])) return;
      Object.assign(p, changes);
      flags.hidden = hidden;
      schedule();
    },
    /** Apply pending changes now (e.g. before measuring or taking a screenshot). */
    flush() {
      if (frame) cancelAnimationFrame(frame);
      flush();
    },
    get params() {
      return { ...p };
    },
    get filterId() {
      return filter.id;
    },
    destroy() {
      destroyed = true;
      if (frame) cancelAnimationFrame(frame);
      settleTimers.forEach(clearTimeout);
      observer?.disconnect();
      filter.remove();
      target.style.filter = '';
      target.style.backdropFilter = '';
      target.style.webkitBackdropFilter = '';
      if (flags.clip) target.style.clipPath = '';
    },
  };
}

function pick(o) {
  const out = {};
  for (const k in DEFAULTS) if (o[k] !== undefined) out[k] = o[k];
  return out;
}

/* ------------------------------------------------------------------------------------------------ */
/* Motion                                                                                             */
/* ------------------------------------------------------------------------------------------------ */

const reducedMotion =
  typeof matchMedia === 'function' ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

/**
 * Critically-damped-ish spring for lens position and squish. `onUpdate(value, velocity)` runs every
 * frame until the spring settles. Honors prefers-reduced-motion by jumping straight to the target.
 */
function createSpring(initial, onUpdate, { stiffness = 520, damping = 38, mass = 1 } = {}) {
  let value = initial;
  let velocity = 0;
  let target = initial;
  let frame = 0;
  let last = 0;

  function step(now) {
    // Fixed 1/120 s sub-steps: the animation keeps its duration when frames are slow or throttled,
    // and one long frame (a background tab coming back) cannot blow the integration up.
    let remaining = Math.min(0.1, (now - last) / 1000 || 1 / 60);
    last = now;
    while (remaining > 1e-6) {
      const dt = Math.min(1 / 120, remaining);
      const force = -stiffness * (value - target) - damping * velocity;
      velocity += (force / mass) * dt;
      value += velocity * dt;
      remaining -= dt;
    }
    if (Math.abs(velocity) < 0.01 && Math.abs(value - target) < 0.01) {
      value = target;
      velocity = 0;
      frame = 0;
      onUpdate(value, 0);
      return;
    }
    onUpdate(value, velocity);
    frame = requestAnimationFrame(step);
  }

  return {
    set(next, { immediate = false } = {}) {
      target = next;
      if (immediate || reducedMotion.matches) {
        if (frame) cancelAnimationFrame(frame);
        frame = 0;
        value = next;
        velocity = 0;
        onUpdate(value, 0);
        return;
      }
      if (!frame) {
        last = performance.now();
        frame = requestAnimationFrame(step);
      }
    },
    get value() {
      return value;
    },
    get target() {
      return target;
    },
    stop() {
      if (frame) cancelAnimationFrame(frame);
      frame = 0;
    },
  };
}
// ---- réglage doux (verre-liquide.js) ----
// Effet volontairement discret : le verre courbe surtout le bord, le centre reste net et lisible.
const REGLAGES = {
  doux: { refraction: 10, bezel: 0.3, curvature: 4, chroma: 0, specular: 0.2, specularWidth: 1 },
  fort: { refraction: 18, bezel: 0.45, curvature: 4, chroma: 0.08, specular: 0.32, specularWidth: 1.5 },
};

const actif =
  engine === 'blink' &&
  !matchMedia('(prefers-reduced-transparency: reduce)').matches &&
  !matchMedia('(prefers-contrast: more)').matches;

const cibles = [];

function poser(el, o) {
  if (el.__verre) return;
  const cs = getComputedStyle(el);
  // Le flou du CSS est repris dans le filtre (plafonné, sinon on ne voit plus la courbure).
  const flou = /blur\(([\d.]+)px\)/.exec(cs.backdropFilter || '');
  const visible = () => !o.si || el.classList.contains(o.si);
  const glass = createGlass(el, {
    mode: 'backdrop',
    fit: true,
    radius: parseFloat(cs.borderTopLeftRadius) || 0,
    blur: o.flou ?? (flou ? Math.min(+flou[1], 6) : 0),
    hidden: !visible(),
    ...REGLAGES[o.reglage || 'doux'],
  });
  el.__verre = glass;
  el.classList.add('verre-liquide');
  // Le rayon peut changer avec la taille de l'écran (media queries).
  new ResizeObserver(() => glass.update({ radius: parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0 })).observe(el);
  if (o.si) new MutationObserver(() => glass.update({ hidden: !visible() })).observe(el, { attributes: true, attributeFilter: ['class'] });
}

function chercher() {
  for (const [sel, o] of cibles) document.querySelectorAll(sel).forEach((el) => poser(el, o));
}

function verre(selecteur, options = {}) {
  if (!actif) return;
  cibles.push([selecteur, options]);
  chercher();
}

if (actif) {
  // Certains éléments (barre d'onglets, fenêtres) sont créés après le chargement.
  let attente = 0;
  const plusTard = () => attente || (attente = requestAnimationFrame(() => ((attente = 0), chercher())));
  new MutationObserver(plusTard).observe(document.documentElement, { childList: true, subtree: true });
  addEventListener('load', chercher);
}
verre('.topbar');
</script>
</body></html>
